# camkeypad status protocol: phone (Open Camera) -> pad, over a custom GATT service.
# Single source of truth. Run `just protocol-gen` after editing; never edit the
# generated files.

version = 2

service_uuid = "1d0d0dc8-5cd6-4d86-b577-af570c2c28c1"
status_char_uuid = "18ec2b07-1988-4f4f-a8bd-8f638d214c38"

# Recording state, sent as u8.
[state]
idle = 0
recording = 1
paused = 2

# Capture mode, sent as u8.
[mode]
photo = 0
video = 1

# Phone charge is sent as a percentage, 0..100, or this when the phone can't report it.
[phone_battery]
unknown = 255

[timing]
heartbeat_ms = 2000
stale_after_ms = 5000

# Status payload, written to status_char_uuid. Fields in wire order, little-endian.
# The first field must be `version` (u8).
[status]
fields = [
    { name = "version", type = "u8" },
    { name = "state", type = "u8" },
    { name = "elapsed_ms", type = "u32" },
    { name = "mode", type = "u8" },
    { name = "phone_battery", type = "u8" },
]
