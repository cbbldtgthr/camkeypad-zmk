CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# The status screen owns blanking, so it can stay lit while recording or paused.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep drops the BLE link, and the status with it, mid-recording.
CONFIG_ZMK_SLEEP=n

# ZMK only raises this for its built-in screen; at the default 2048 this screen crashes at boot.
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# Keys always go to the phone. With USB on, ZMK sends them down the cable whenever one
# is plugged in, so charging from a computer would steal the shutter.
CONFIG_ZMK_USB=n
